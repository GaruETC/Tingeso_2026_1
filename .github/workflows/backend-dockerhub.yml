name: Continuous Delivery Pipeline

on:
  push:
    branches: 
      - main
  workflow_dispatch: 

jobs:
  backend-tests:
    name: Pruebas unitarias y de integracion
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Ejecutar pruebas unitarias
        working-directory: ./demo
        run: mvn clean test

      - name: Ejecutar pruebas de integracion
        working-directory: ./demo
        run: mvn verify -DskipUnitTests

  build-and-publish:
    name: Construccion y publicacion de Docker
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo fuente
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v5
        with:
          context: ./demo
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ipt-backend:latest

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ipt-frontend:latest





    
