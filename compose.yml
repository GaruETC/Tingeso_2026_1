version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: Tingeso_2026_1
      MYSQL_USER: garu
      MYSQL_PASSWORD: Cuchufli-100
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak-server
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev --import-realm
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-network
    restart: always

  backend:
    image: garuetc/ipt-backend:latest
    build: ./demo
    environment:
      - DB_USERNAME=garu
      - DB_PASSWORD=Cuchufli-100
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/Tingeso_2026_1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/sisgr-realm/protocol/openid-connect/certs
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 3
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx-backend-lb:
    image: nginx:alpine
    container_name: nginx-backend-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - backend
    restart: always

  frontend:
    image: garuetc/ipt-frontend:latest
    container_name: ipt-frontend
    ports:
      - "8070:80"
    networks:
      - app-network
    depends_on:
      - nginx-backend-lb
    restart: always

volumes:
  mysql_data:
    driver: local
  keycloak_data:
    driver: local

networks:
  app-network:
    driver: bridge